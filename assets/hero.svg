<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'JetBrains Mono', 'Fira Code', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="r1"><rect x="40" y="0" height="300" width="0"><animate attributeName="width" from="0" to="1100" dur="0.7s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="r2"><rect x="40" y="0" height="300" width="0"><animate attributeName="width" from="0" to="1100" dur="0.5s" begin="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="r3"><rect x="40" y="0" height="300" width="0"><animate attributeName="width" from="0" to="1100" dur="0.6s" begin="1.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="r4"><rect x="40" y="0" height="300" width="0"><animate attributeName="width" from="0" to="1100" dur="0.6s" begin="2.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="r5"><rect x="40" y="0" height="300" width="0"><animate attributeName="width" from="0" to="1100" dur="0.5s" begin="3.1s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- Terminal frame -->
  <rect width="1200" height="300" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect width="1200" height="34" rx="12" fill="#161b22"/>
  <rect y="16" width="1200" height="18" fill="#161b22"/>
  <line x1="0" y1="34" x2="1200" y2="34" stroke="#30363d" stroke-width="1"/>
  <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
  <circle cx="38" cy="17" r="5.5" fill="#febc2e"/>
  <circle cx="56" cy="17" r="5.5" fill="#28c840"/>
  <text x="600" y="22" text-anchor="middle" fill="#484f58" font-size="11">siddhartha@galaxy ~ zsh</text>

  <!-- Terminal lines -->
  <g font-size="16">
    <g clip-path="url(#r1)">
      <text x="40" y="72" fill="#58a6ff" font-weight="700">$</text>
      <text x="58" y="72" fill="#e6edf3"> whoami</text>
      <text x="40" y="100" fill="#7ee787">></text>
      <text x="58" y="100" fill="url(#nameGrad)" font-weight="700" font-size="20" filter="url(#glow)">Siddhartha Pal</text>
      <text x="250" y="100" fill="#8b949e">— Full-Stack Developer</text>
    </g>

    <g clip-path="url(#r2)">
      <text x="40" y="140" fill="#58a6ff" font-weight="700">$</text>
      <text x="58" y="140" fill="#e6edf3"> cat role.txt</text>
      <text x="40" y="168" fill="#7ee787">></text>
      <text x="58" y="168" fill="#e6edf3">SDE Intern @</text>
      <text x="200" y="168" fill="#f0883e" font-weight="600"> Galaxy.ai</text>
    </g>

    <g clip-path="url(#r3)">
      <text x="40" y="206" fill="#58a6ff" font-weight="700">$</text>
      <text x="58" y="206" fill="#e6edf3"> ls stack/</text>
    </g>

    <g clip-path="url(#r4)">
      <text x="40" y="234" fill="#79c0ff">react</text>
      <text x="110" y="234" fill="#79c0ff">next.js</text>
      <text x="200" y="234" fill="#79c0ff">typescript</text>
      <text x="330" y="234" fill="#79c0ff">node</text>
      <text x="400" y="234" fill="#79c0ff">convex</text>
      <text x="490" y="234" fill="#79c0ff">trigger.dev</text>
      <text x="620" y="234" fill="#79c0ff">tailwind</text>
      <text x="738" y="234" fill="#79c0ff">firebase</text>
    </g>

    <g clip-path="url(#r5)">
      <text x="40" y="272" fill="#58a6ff" font-weight="700">$</text>
      <text x="58" y="272" fill="#e6edf3"> echo $STATUS</text>
      <text x="240" y="272" fill="#7ee787" font-weight="600">Building in production</text>
      <text x="503" y="272" fill="#7ee787"> ●</text>
    </g>
  </g>

  <!-- Blinking cursor -->
  <rect x="527" y="258" width="9" height="18" fill="#58a6ff">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" begin="3.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtle grid lines for depth -->
  <g opacity="0.03" stroke="#58a6ff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="170" x2="1200" y2="170"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>
</svg>
