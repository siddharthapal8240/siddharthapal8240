<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="'JetBrains Mono', 'Fira Code', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
      <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <!-- Reveal masks for typewriter effect, staggered per line -->
    <clipPath id="r1"><rect x="40" y="0" height="420" width="0"><animate attributeName="width" from="0" to="700" dur="1.0s" begin="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="r2"><rect x="40" y="0" height="420" width="0"><animate attributeName="width" from="0" to="700" dur="0.6s" begin="1.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="r3"><rect x="40" y="0" height="420" width="0"><animate attributeName="width" from="0" to="700" dur="0.9s" begin="2.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="r4"><rect x="40" y="0" height="420" width="0"><animate attributeName="width" from="0" to="700" dur="0.6s" begin="3.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="r5"><rect x="40" y="0" height="420" width="0"><animate attributeName="width" from="0" to="700" dur="0.9s" begin="3.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="r6"><rect x="40" y="0" height="420" width="0"><animate attributeName="width" from="0" to="700" dur="0.6s" begin="4.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="r7"><rect x="40" y="0" height="420" width="0"><animate attributeName="width" from="0" to="700" dur="0.8s" begin="5.6s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- Terminal frame -->
  <rect width="1200" height="420" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="36" rx="14" fill="#21262d"/>
  <rect y="18" width="1200" height="18" fill="#21262d"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="600" y="23" text-anchor="middle" fill="#8b949e" font-size="12">siddhartha@galaxy:~ — zsh</text>

  <!-- Faint grid for depth -->
  <g opacity="0.04" stroke="#8b5cf6" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="220" x2="1200" y2="220"/><line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="340" x2="1200" y2="340"/>
  </g>

  <!-- Lines with typewriter reveal -->
  <g font-size="18" font-weight="500">
    <g clip-path="url(#r1)">
      <text x="40" y="90" fill="#8b5cf6">$</text>
      <text x="62" y="90" fill="#c9d1d9">whoami --verbose</text>
    </g>
    <g clip-path="url(#r2)">
      <text x="40" y="120" fill="#7ee787">→</text>
      <text x="62" y="120" fill="url(#title)" font-weight="700" font-size="22" filter="url(#glow)">Siddhartha Pal</text>
      <text x="240" y="120" fill="#8b949e">// SDE Intern @ Galaxy.ai</text>
    </g>

    <g clip-path="url(#r3)">
      <text x="40" y="170" fill="#8b5cf6">$</text>
      <text x="62" y="170" fill="#c9d1d9">cat ./mission.md</text>
    </g>
    <g clip-path="url(#r4)">
      <text x="40" y="200" fill="#7ee787">→</text>
      <text x="62" y="200" fill="#c9d1d9">Building config-driven UI + AI orchestration systems</text>
    </g>

    <g clip-path="url(#r5)">
      <text x="40" y="250" fill="#8b5cf6">$</text>
      <text x="62" y="250" fill="#c9d1d9">ls ./stack/</text>
    </g>
    <g clip-path="url(#r6)">
      <text x="40" y="280" fill="#79c0ff">react.tsx</text>
      <text x="160" y="280" fill="#79c0ff">next.tsx</text>
      <text x="270" y="280" fill="#79c0ff">node.js</text>
      <text x="370" y="280" fill="#79c0ff">convex.ts</text>
      <text x="490" y="280" fill="#79c0ff">trigger.dev</text>
      <text x="630" y="280" fill="#79c0ff">inngest</text>
      <text x="730" y="280" fill="#79c0ff">gemini.ai</text>
    </g>

    <g clip-path="url(#r7)">
      <text x="40" y="330" fill="#8b5cf6">$</text>
      <text x="62" y="330" fill="#c9d1d9">./run portfolio --interactive</text>
      <text x="380" y="330" fill="#7ee787">[ READY ]</text>
    </g>
  </g>

  <!-- Loading bar that fills then loops subtly -->
  <g transform="translate(40, 360)">
    <rect width="500" height="10" rx="5" fill="#21262d" stroke="#30363d"/>
    <rect height="10" rx="5" fill="url(#title)" width="0">
      <animate attributeName="width" from="0" to="500" dur="2.5s" begin="6.4s" fill="freeze"/>
    </rect>
    <text x="510" y="9" fill="#8b949e" font-size="12" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="8.9s" dur="0.3s" fill="freeze"/>
      ████████ 100%
    </text>
  </g>

  <!-- Blinking cursor that follows the last line -->
  <rect x="595" y="316" width="10" height="20" fill="#8b5cf6">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" begin="6.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Decorative pixel character (right side) - waving sprite -->
  <g transform="translate(1000, 110)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.6s" fill="freeze"/>
    <!-- Body -->
    <g shape-rendering="crispEdges">
      <!-- Hair -->
      <rect x="40" y="20" width="80" height="20" fill="#1f1f1f"/>
      <rect x="35" y="25" width="10" height="20" fill="#1f1f1f"/>
      <rect x="115" y="25" width="10" height="20" fill="#1f1f1f"/>
      <!-- Face -->
      <rect x="45" y="40" width="70" height="50" fill="#f5cba7"/>
      <rect x="55" y="55" width="8" height="8" fill="#1f1f1f"/>
      <rect x="95" y="55" width="8" height="8" fill="#1f1f1f"/>
      <rect x="65" y="75" width="30" height="6" fill="#c0392b"/>
      <!-- Hoodie -->
      <rect x="30" y="90" width="100" height="60" fill="#8b5cf6"/>
      <rect x="50" y="90" width="60" height="20" fill="#7c3aed"/>
      <text x="80" y="130" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">&lt;/&gt;</text>
      <!-- Arm with wave animation -->
      <g transform="translate(120, 100)">
        <rect x="0" y="0" width="20" height="40" fill="#8b5cf6">
          <animateTransform attributeName="transform" type="rotate" values="0 10 0; -25 10 0; 0 10 0; 25 10 0; 0 10 0" dur="2s" begin="2.6s" repeatCount="3"/>
        </rect>
        <rect x="-2" y="-12" width="24" height="14" fill="#f5cba7">
          <animateTransform attributeName="transform" type="rotate" values="0 10 0; -25 10 0; 0 10 0; 25 10 0; 0 10 0" dur="2s" begin="2.6s" repeatCount="3"/>
        </rect>
      </g>
    </g>
    <!-- Speech bubble -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="3.5s" fill="freeze"/>
      <rect x="-90" y="-10" width="115" height="35" rx="6" fill="#ffffff"/>
      <polygon points="20,25 30,25 25,35" fill="#ffffff"/>
      <text x="-32" y="13" text-anchor="middle" fill="#1f1f1f" font-size="13" font-weight="700">Hey there!</text>
    </g>
  </g>

  <!-- Subtle floating particles -->
  <g fill="#8b5cf6" opacity="0.4">
    <circle cx="900" cy="350" r="2"><animate attributeName="cy" values="350;330;350" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="380" r="1.5"><animate attributeName="cy" values="380;355;380" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="360" r="2"><animate attributeName="cy" values="360;335;360" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="390" r="1.5"><animate attributeName="cy" values="390;365;390" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="370" r="2"><animate attributeName="cy" values="370;345;370" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
