<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="r1"><rect x="40" y="0" height="320" width="0"><animate attributeName="width" from="0" to="900" dur="0.8s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="r2"><rect x="40" y="0" height="320" width="0"><animate attributeName="width" from="0" to="900" dur="0.6s" begin="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="r3"><rect x="40" y="0" height="320" width="0"><animate attributeName="width" from="0" to="900" dur="0.5s" begin="1.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="r4"><rect x="40" y="0" height="320" width="0"><animate attributeName="width" from="0" to="900" dur="0.7s" begin="2.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="r5"><rect x="40" y="0" height="320" width="0"><animate attributeName="width" from="0" to="900" dur="0.6s" begin="3.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="r6"><rect x="40" y="0" height="320" width="0"><animate attributeName="width" from="0" to="900" dur="0.5s" begin="4.0s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- Terminal frame -->
  <rect width="1200" height="320" rx="12" fill="url(#bg)"/>
  <rect width="1200" height="34" rx="12" fill="#161b22"/>
  <rect y="16" width="1200" height="18" fill="#161b22"/>
  <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
  <circle cx="38" cy="17" r="5.5" fill="#febc2e"/>
  <circle cx="56" cy="17" r="5.5" fill="#28c840"/>
  <text x="600" y="22" text-anchor="middle" fill="#484f58" font-size="11">siddhartha@dev ~ </text>

  <!-- Terminal content -->
  <g font-size="16">
    <g clip-path="url(#r1)">
      <text x="40" y="72" fill="#484f58">~</text>
      <text x="56" y="72" fill="#60a5fa">$</text>
      <text x="72" y="72" fill="#e6edf3"> cat intro.json</text>
    </g>

    <g clip-path="url(#r2)">
      <text x="40" y="108" fill="#e6edf3">{</text>
      <text x="56" y="136" fill="#a78bfa">"name"</text>
      <text x="114" y="136" fill="#e6edf3">:</text>
      <text x="126" y="136" fill="#a5d6ff">"Siddhartha Pal"</text>
      <text x="296" y="136" fill="#e6edf3">,</text>
    </g>

    <g clip-path="url(#r3)">
      <text x="56" y="164" fill="#a78bfa">"role"</text>
      <text x="114" y="164" fill="#e6edf3">:</text>
      <text x="126" y="164" fill="#a5d6ff">"SDE Intern @ Galaxy.ai"</text>
      <text x="370" y="164" fill="#e6edf3">,</text>
    </g>

    <g clip-path="url(#r4)">
      <text x="56" y="192" fill="#a78bfa">"focus"</text>
      <text x="122" y="192" fill="#e6edf3">:</text>
      <text x="134" y="192" fill="#a5d6ff">"Full-Stack &amp; AI Infrastructure"</text>
      <text x="478" y="192" fill="#e6edf3">,</text>
    </g>

    <g clip-path="url(#r5)">
      <text x="56" y="220" fill="#a78bfa">"stack"</text>
      <text x="122" y="220" fill="#e6edf3">:</text>
      <text x="134" y="220" fill="#484f58">[</text>
      <text x="146" y="220" fill="#a5d6ff">"React"</text>
      <text x="210" y="220" fill="#484f58">,</text>
      <text x="222" y="220" fill="#a5d6ff">"Next.js"</text>
      <text x="302" y="220" fill="#484f58">,</text>
      <text x="314" y="220" fill="#a5d6ff">"TypeScript"</text>
      <text x="418" y="220" fill="#484f58">,</text>
      <text x="430" y="220" fill="#a5d6ff">"Node"</text>
      <text x="490" y="220" fill="#484f58">,</text>
      <text x="502" y="220" fill="#a5d6ff">"Convex"</text>
      <text x="578" y="220" fill="#484f58">]</text>
    </g>

    <g clip-path="url(#r6)">
      <text x="40" y="248" fill="#e6edf3">}</text>
    </g>
  </g>

  <!-- Blinking cursor -->
  <rect x="56" y="260" width="9" height="17" fill="#60a5fa" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" dur="1.2s" begin="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtle corner decoration -->
  <g opacity="0.06" stroke="url(#accent)" stroke-width="1" fill="none">
    <rect x="1050" y="60" width="120" height="230" rx="8"/>
    <line x1="1070" y1="90" x2="1150" y2="90"/>
    <line x1="1070" y1="120" x2="1130" y2="120"/>
    <line x1="1070" y1="150" x2="1140" y2="150"/>
    <line x1="1070" y1="180" x2="1120" y2="180"/>
    <line x1="1070" y1="210" x2="1150" y2="210"/>
    <line x1="1070" y1="240" x2="1110" y2="240"/>
  </g>
</svg>
