<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>
    <clipPath id="r1"><rect x="48" y="0" height="280" width="0"><animate attributeName="width" from="0" to="1100" dur="0.6s" begin="0.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="r2"><rect x="48" y="0" height="280" width="0"><animate attributeName="width" from="0" to="1100" dur="0.5s" begin="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="r3"><rect x="48" y="0" height="280" width="0"><animate attributeName="width" from="0" to="1100" dur="0.5s" begin="1.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="r4"><rect x="48" y="0" height="280" width="0"><animate attributeName="width" from="0" to="1100" dur="0.6s" begin="2.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="r5"><rect x="48" y="0" height="280" width="0"><animate attributeName="width" from="0" to="1100" dur="0.5s" begin="2.8s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="1200" height="280" rx="10" fill="url(#bg)"/>

  <!-- Top bar -->
  <rect width="1200" height="30" rx="10" fill="#161616"/>
  <rect y="14" width="1200" height="16" fill="#161616"/>
  <circle cx="18" cy="15" r="5" fill="#ff5f57"/>
  <circle cx="34" cy="15" r="5" fill="#febc2e"/>
  <circle cx="50" cy="15" r="5" fill="#28c840"/>
  <text x="600" y="19" text-anchor="middle" fill="#3b3b3b" font-size="10">zsh</text>

  <g font-size="15">
    <g clip-path="url(#r1)">
      <text x="48" y="65" fill="#525252">~</text>
      <text x="62" y="65" fill="#e5e5e5"> Siddhartha Pal</text>
      <text x="230" y="65" fill="#525252"> / </text>
      <text x="252" y="65" fill="#a3a3a3">Full-Stack Developer</text>
    </g>

    <g clip-path="url(#r2)">
      <text x="48" y="105" fill="#525252">></text>
      <text x="64" y="105" fill="#a3a3a3">SDE Intern at</text>
      <text x="210" y="105" fill="#e5e5e5"> Galaxy.ai</text>
    </g>

    <g clip-path="url(#r3)">
      <text x="48" y="145" fill="#525252">></text>
      <text x="64" y="145" fill="#a3a3a3">Building config-driven UI systems &amp; AI infrastructure</text>
    </g>

    <g clip-path="url(#r4)">
      <text x="48" y="185" fill="#525252">></text>
      <text x="64" y="185" fill="#a3a3a3">Stack:</text>
      <text x="130" y="185" fill="#737373">React · Next.js · TypeScript · Node · Convex · Trigger.dev</text>
    </g>

    <g clip-path="url(#r5)">
      <text x="48" y="225" fill="#525252">></text>
      <text x="64" y="225" fill="#a3a3a3">B.Tech CSE '26 · JIS College of Engineering</text>
    </g>
  </g>

  <!-- Cursor -->
  <rect x="48" y="245" width="8" height="15" fill="#525252" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" dur="1.2s" begin="3.3s" repeatCount="indefinite"/>
  </rect>
</svg>
